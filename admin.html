<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NjiaMauzo Afrika — Admin Library</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#182238}
.top{height:64px;background:#2677e8;color:white;display:flex;align-items:center;padding:0 22px;font-weight:900;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:72px;background:#fff;border-right:1px solid #e5eaf0;padding-top:18px;text-align:center}aside div{padding:15px;font-size:22px}
main{max-width:1050px;width:100%;padding:32px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.head h1{margin:0}.add{background:#2677e8;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
.card{background:#fff;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 7px 22px #12213b12;border:1px solid #e7ebf0}.title{display:flex;justify-content:space-between;gap:15px}.title h2{margin:0;font-size:20px}.cat{color:#6d7788;margin:6px 0 14px}.desc{color:#596579;line-height:1.5}.source{margin-top:18px;padding:14px;border-radius:12px;background:#f7faff;border:1px solid #dce9fb}.source small{display:block;color:#667085;font-weight:800;margin-bottom:6px}.source a{color:#1670e8;word-break:break-all}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;border-top:1px solid #edf0f4;padding-top:16px}.price{font-size:18px;font-weight:900}.open{border:1px solid #2677e8;background:#fff;color:#2677e8;border-radius:9px;padding:10px 18px;font-weight:900;text-decoration:none}.delete{color:#e33434;cursor:pointer;font-size:18px}
.modal{position:fixed;inset:0;background:#08102b88;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:white;border-radius:20px;padding:25px;width:min(560px,100%)}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d5dce6;border-radius:10px;font:inherit}textarea{min-height:90px}.row{display:flex;gap:10px;margin-top:18px}.save{background:#2677e8;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:900}.cancel{border:0;background:#eef2f7;border-radius:10px;padding:12px 20px;font-weight:900}
@media(max-width:700px){main{padding:20px 14px}.head{align-items:flex-start;flex-direction:column}aside{display:none}.top{font-size:17px}}
</style>
</head>
<body>
<div class="top">☰ &nbsp; NjiaMauzo Afrika — Admin</div>
<div class="layout">
<aside><div>⌂</div><div>▣</div><div>📖</div><div>👥</div><div>🛒</div><div>✉</div><div>⚙</div></aside>
<main>
  <div class="head"><div><h1>📚 Maktaba ya Masomo</h1><p>Ongeza somo na <b>chanzo chake cha kuaminika</b>. Vyanzo havionekani kwenye ukurasa wa umma.</p></div><button class="add" onclick="openModal()">＋ Ongeza Somo</button></div>
  <div id="library"></div>
</main></div>

<div class="modal" id="modal"><div class="box">
<h2 id="modalTitle">Ongeza Somo</h2>
<label>Jina la somo</label><input id="name" placeholder="Mfano: Ujasiriamali na Biashara">
<label>Kategoria</label><select id="category"><option>Biashara</option><option>Masoko</option><option>Elimu</option><option>Fedha</option><option>Kilimo</option><option>Teknolojia</option></select>
<label>Maelezo</label><textarea id="desc" placeholder="Maelezo mafupi ya somo"></textarea>
<label>Chanzo cha kuaminika (LINK)</label><input id="source" type="url" placeholder="https://...">
<label>Bei ya somo (TZS)</label><input id="price" type="number" value="3000">
<div class="row"><button class="save" onclick="saveLesson()">Hifadhi</button><button class="cancel" onclick="closeModal()">Funga</button></div>
</div></div>

<script>
const KEY='njiaMauzoLessons';
let lessons=JSON.parse(localStorage.getItem(KEY)||'null')||[
 {name:'Ujasiriamali na Biashara',category:'Biashara',desc:'Mwongozo kamili wa ujasiriamali na uendeshaji wa biashara.',source:'https://www.ifc.org/en/what-we-do/topics/small-business',price:3000},
 {name:'Masoko ya Kidijitali',category:'Masoko',desc:'Jifunze misingi ya masoko ya kidijitali na ujenzi wa chapa.',source:'https://learndigital.withgoogle.com/digitalgarage',price:3000},
 {name:'Usimamizi wa Fedha',category:'Fedha',desc:'Misingi ya usimamizi wa fedha kwa biashara ndogo.',source:'https://www.sba.gov/business-guide/manage-your-business/finance-your-business',price:3000},
 {name:'Kilimo Bora',category:'Kilimo',desc:'Mbinu za kilimo kwa mavuno bora na uendelevu.',source:'https://www.fao.org/family-farming/detail/en/c/84894/',price:3000}
];
let editIndex=-1;
function persist(){localStorage.setItem(KEY,JSON.stringify(lessons));render()}
function render(){
 const el=document.getElementById('library');
 el.innerHTML=lessons.map((x,i)=>`<article class="card">
 <div class="title"><div><h2>${esc(x.name)}</h2><div class="cat">${esc(x.category)}</div></div><span class="delete" title="Futa" onclick="removeLesson(${i})">🗑</span></div>
 <div class="desc">${esc(x.desc)}</div>
 <div class="source"><small>CHANZO CHA KUAMINIKA — ADMIN PEKEE</small><a href="${escAttr(x.source)}" target="_blank" rel="noopener noreferrer">${esc(x.source)} ↗</a></div>
 <div class="bottom"><span class="price">TZS ${Number(x.price||0).toLocaleString()}</span><a class="open" href="${escAttr(x.source)}" target="_blank" rel="noopener noreferrer">Fungua chanzo ↗</a></div>
 </article>`).join('');
}
function openModal(){editIndex=-1;['name','desc','source'].forEach(id=>document.getElementById(id).value='');document.getElementById('price').value=3000;document.getElementById('category').value='Biashara';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveLesson(){
 const x={name:name.value.trim(),category:category.value,desc:desc.value.trim(),source:source.value.trim(),price:Number(price.value||0)};
 if(!x.name||!x.source){alert('Weka jina la somo na chanzo cha kuaminika.');return}
 if(!/^https?:\\/\\//i.test(x.source)){alert('Chanzo lazima kiwe link ya http/https.');return}
 if(editIndex>=0) lessons[editIndex]=x; else lessons.push(x); persist(); closeModal();
}
function removeLesson(i){if(confirm('Futa somo hili kwenye Maktaba ya Admin?')){lessons.splice(i,1);persist()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(s){return esc(s)}
render();
</script>
</body>
</html>
