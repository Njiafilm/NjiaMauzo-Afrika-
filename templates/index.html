<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Listings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f0f2f5;
      color: #1c1e21;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: #1877f2;
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: none;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
    }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ===== CATEGORIES ===== */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: white;
      border: 1px solid #ccd0d5;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: #1877f2;
      color: white;
      border-color: #1877f2;
    }

    /* ===== LISTINGS GRID ===== */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .listing-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .listing-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .listing-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .listing-card .info {
      padding: 12px 14px 16px;
    }

    .listing-card h3 {
      font-size: 1rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .listing-card .price {
      color: #1877f2;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .listing-card .location {
      font-size: 0.8rem;
      color: #65676b;
      margin-top: 4px;
    }

    /* ===== DETAIL VIEW ===== */
    .detail-view {
      display: none;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    .detail-view.active {
      display: block;
    }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding: 24px;
    }

    .detail-image {
      flex: 1 1 320px;
      max-width: 440px;
    }

    .detail-image img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      aspect-ratio: 1/1;
    }

    .detail-info {
      flex: 1 1 280px;
    }

    .detail-info h1 {
      font-size: 1.55rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .detail-info .price {
      font-size: 1.6rem;
      color: #1877f2;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .detail-info .meta {
      background: #f0f2f5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .detail-info .meta div {
      margin-bottom: 4px;
    }

    .detail-info .description {
      color: #333;
      margin-bottom: 22px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    #btnLike {
      background: #e4e6eb;
      color: #050505;
    }

    #btnLike.liked {
      background: #ffebee;
      color: #e41e3f;
    }

    #btnLike:hover { background: #d8dadf; }
    #btnLike.liked:hover { background: #ffcdd2; }

    .btn-contact {
      background: #42b72a;
      color: white;
    }
    .btn-contact:hover { background: #36a420; }

    .btn-share {
      background: #e4e6eb;
    }
    .btn-share:hover { background: #d8dadf; }

    .btn-back {
      background: #e4e6eb;
    }
    .btn-back:hover { background: #d8dadf; }

    /* ===== COMMENTS ===== */
    .comments-section {
      border-top: 1px solid #e4e6eb;
      padding: 20px 24px 28px;
    }

    .comments-section h3 {
      margin-bottom: 14px;
      font-size: 1.15rem;
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .comment-form input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .comment-form input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24,119,242,0.2);
    }

    .comment-form button {
      background: #1877f2;
      color: white;
      padding: 0 20px;
    }
    .comment-form button:hover { background: #166fe5; }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment {
      background: #f0f2f5;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .comment .author {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 3px;
    }

    .comment .text {
      color: #050505;
    }

    .comment .time {
      font-size: 0.78rem;
      color: #65676b;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      color: #65676b;
      padding: 24px;
      font-size: 0.95rem;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #323232;
      color: white;
      padding: 13px 26px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: #e41e3f;
    }

    /* ===== NO RESULTS ===== */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #65676b;
    }

    @media (max-width: 640px) {
      .detail-header {
        flex-direction: column;
        padding: 16px;
      }
      .detail-image {
        max-width: 100%;
      }
      .detail-info h1 {
        font-size: 1.3rem;
      }
      .actions {
        flex-direction: column;
      }
      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🛍️ Marketplace</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tafuta bidhaa..." oninput="filterListings()">
    </div>
  </div>
</header>

<div class="container">
  <!-- Categories -->
  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="all">Zote</button>
    <button class="cat-btn" data-cat="simu">Simu</button>
    <button class="cat-btn" data-cat="kompyuta">Kompyuta</button>
    <button class="cat-btn" data-cat="gaming">Gaming</button>
    <button class="cat-btn" data-cat="nyumba">Nyumba</button>
  </div>

  <!-- Grid -->
  <div class="listings-grid" id="listingsGrid"></div>

  <!-- Detail View -->
  <div class="detail-view" id="detailView">
    <div class="detail-header">
      <div class="detail-image">
        <img id="detailImg" src="" alt="Listing">
      </div>
      <div class="detail-info">
        <h1 id="detailTitle">—</h1>
        <div class="price" id="detailPrice">—</div>
        <div class="meta">
          <div id="detailSeller">Muuzaji: —</div>
          <div id="detailLocation">📍 —</div>
          <div id="detailCategory">Kategoria: —</div>
        </div>
        <div class="description" id="detailDesc">—</div>
        <div class="actions">
          <button id="btnLike">🤍 Penda</button>
          <button class="btn-contact" onclick="contactSeller()">📞 Wasiliana</button>
          <button class="btn-share" onclick="shareListing()">📤 Shiriki</button>
          <button class="btn-back" onclick="closeDetail()">← Rudi</button>
        </div>
      </div>
    </div>

    <div class="comments-section">
      <h3>Maoni (<span id="commentCount">0</span>)</h3>
      <div class="comment-form">
        <input type="text" id="commentInput" placeholder="Andika maoni yako...">
        <button onclick="addComment()">Tuma</button>
      </div>
      <div class="comments-list" id="commentsList">
        <div class="empty">Hakuna maoni bado</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====================== DATA ======================
  const mockListings = [
    {
      id: 1,
      title: "iPhone 13 Pro 128GB",
      price: 850000,
      description: "Simu bora sana, battery health 92%. Inakuja na charger original + box. Hakuna scratches. Imekuwa ikitumika kwa miezi 8 tu.",
      image: "https://images.unsplash.com/photo-1632661674596-df8beabbfa48?w=600",
      seller_id: 101,
      seller_name: "John Mushi",
      location: "Dar es Salaam, Mikocheni",
      category: "simu",
      liked: false
    },
    {
      id: 2,
      title: "Laptop Dell XPS 13",
      price: 1200000,
      description: "Intel Core i7 11th Gen, 16GB RAM, 512GB SSD. Perfect for work, coding na design. Battery inaenda saa 8+.",
      image: "https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=600",
      seller_id: 102,
      seller_name: "Amina Juma",
      location: "Arusha, Njiro",
      category: "kompyuta",
      liked: false
    },
    {
      id: 3,
      title: "Samsung Galaxy S23 Ultra",
      price: 980000,
      description: "Mpya kabisa, bado sealed. Rangi Phantom Black. 256GB storage.",
      image: "https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?w=600",
      seller_id: 101,
      seller_name: "John Mushi",
      location: "Dar es Salaam, Mikocheni",
      category: "simu",
      liked: false
    },
    {
      id: 4,
      title: "PlayStation 5 + 2 Controllers",
      price: 950000,
      description: "PS5 Disc Version + 2 DualSense controllers + FIFA 24 + Spider-Man 2. Condition 9.5/10.",
      image: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=600",
      seller_id: 103,
      seller_name: "Peter Kimaro",
      location: "Mwanza, Nyamagana",
      category: "gaming",
      liked: false
    },
    {
      id: 5,
      title: "MacBook Air M2 2023",
      price: 1850000,
      description: "8GB RAM, 256GB SSD. Rangi Midnight. Warranty bado inaendelea.",
      image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600",
      seller_id: 104,
      seller_name: "Grace Mwangi",
      location: "Dodoma, Town",
      category: "kompyuta",
      liked: false
    },
    {
      id: 6,
      title: "Xbox Series X",
      price: 890000,
      description: "1TB, + Game Pass Ultimate miezi 3. Controllers 2.",
      image: "https://images.unsplash.com/photo-1621259182978-fbf93132d53d?w=600",
      seller_id: 103,
      seller_name: "Peter Kimaro",
      location: "Mwanza, Nyamagana",
      category: "gaming",
      liked: false
    }
  ];

  // Comments zinaanza tupu, zitawekwa kwenye localStorage
  let mockComments = JSON.parse(localStorage.getItem("comments") || "{}");

  // ====================== STATE ======================
  let currentListingId = null;
  let currentSellerId = null;
  let currentCategory = "all";
  let searchQuery = "";

  // ====================== HELPERS ======================
  function formatPrice(n) {
    return "TSh " + Number(n).toLocaleString("en-TZ");
  }

  function toast(msg, isError = false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (isError ? " error" : "");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  // Mock API
  async function api(url, options = {}) {
    await new Promise(r => setTimeout(r, 250));

    // GET listing
    const match = url.match(/\/api\/listings\/(\d+)/);
    if (match) {
      const id = parseInt(match[1]);
      const listing = mockListings.find(l => l.id === id);
      if (!listing) return { error: "Listing haipatikani" };

      // Angalia kama imependwa kutoka localStorage
      const likedIds = JSON.parse(localStorage.getItem("likedListings") || "[]");
      return { ...listing, liked: likedIds.includes(id) };
    }

    // Like
    if (url === "/api/like" && options.method === "POST") {
      return { success: true };
    }

    return { error: "Endpoint haijulikani" };
  }

  // ====================== RENDER LISTINGS ======================
  function renderListings() {
    const grid = document.getElementById("listingsGrid");
    const detail = document.getElementById("detailView");

    // Ikiwa detail iko wazi, usionyeshe grid
    if (detail.classList.contains("active")) return;

    let filtered = mockListings.filter(l => {
      const matchCat = currentCategory === "all" || l.category === currentCategory;
      const matchSearch = !searchQuery || 
        l.title.toLowerCase().includes(searchQuery) ||
        l.description.toLowerCase().includes(searchQuery) ||
        l.seller_name.toLowerCase().includes(searchQuery);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="no-results">Hakuna matokeo yanayopatikana 😔</div>`;
      return;
    }

    grid.innerHTML = filtered.map(l => `
      <div class="listing-card" onclick="openListing(${l.id})">
        <img src="\( {l.image}" alt=" \){l.title}" loading="lazy">
        <div class="info">
          <h3>${l.title}</h3>
          <div class="price">${formatPrice(l.price)}</div>
          <div class="location">📍 ${l.location.split(",")[0]}</div>
        </div>
      </div>
    `).join("");
  }

  // ====================== OPEN LISTING ======================
  async function openListing(id) {
    currentListingId = id;

    const data = await api(`/api/listings/${id}`);
    if (data.error) {
      toast(data.error, true);
      return;
    }

    currentSellerId = data.seller_id || null;

    // Hide grid, show detail
    document.getElementById("listingsGrid").style.display = "none";
    document.getElementById("categories").style.display = "none";
    document.getElementById("detailView").classList.add("active");

    // Fill data
    document.getElementById("detailImg").src = data.image;
    document.getElementById("detailTitle").textContent = data.title;
    document.getElementById("detailPrice").textContent = formatPrice(data.price);
    document.getElementById("detailSeller").textContent = "Muuzaji: " + data.seller_name;
    document.getElementById("detailLocation").textContent = "📍 " + data.location;
    document.getElementById("detailCategory").textContent = "Kategoria: " + data.category.charAt(0).toUpperCase() + data.category.slice(1);
    document.getElementById("detailDesc").textContent = data.description;

    // Update like button
    const btn = document.getElementById("btnLike");
    if (btn) {
      btn.innerHTML = data.liked ? "❤️ Umeipenda" : "🤍 Penda";
      btn.classList.toggle("liked", !!data.liked);
    }

    loadComments(id);
  }

  function closeDetail() {
    document.getElementById("detailView").classList.remove("active");
    document.getElementById("listingsGrid").style.display = "grid";
    document.getElementById("categories").style.display = "flex";
    currentListingId = null;
    renderListings();
  }

  // ====================== LIKE ======================
  document.getElementById("btnLike").addEventListener("click", async () => {
    if (!currentListingId) return;

    const likedIds = JSON.parse(localStorage.getItem("likedListings") || "[]");
    const isLiked = likedIds.includes(currentListingId);

    if (isLiked) {
      // Ondoa
      const newIds = likedIds.filter(id => id !== currentListingId);
      localStorage.setItem("likedListings", JSON.stringify(newIds));
    } else {
      // Ongeza
      likedIds.push(currentListingId);
      localStorage.setItem("likedListings", JSON.stringify(likedIds));
    }

    // Update UI
    const btn = document.getElementById("btnLike");
    const nowLiked = !isLiked;
    btn.innerHTML = nowLiked ? "❤️ Umeipenda" : "🤍 Penda";
    btn.classList.toggle("liked", nowLiked);

    // Call API (mock)
    await api("/api/like", { method: "POST" });
    toast(nowLiked ? "Umeipenda!" : "Umeondoa like");
  });

  // ====================== COMMENTS ======================
  function loadComments(id) {
    const list = document.getElementById("commentsList");
    const comments = mockComments[id] || [];

    document.getElementById("commentCount").textContent = comments.length;

    if (comments.length === 0) {
      list.innerHTML = `<div class="empty">Hakuna maoni bado. Kuwa wa kwanza!</div>`;
      return;
    }

    list.innerHTML = comments.map(c => `
      <div class="comment">
        <div class="author">${c.author}</div>
        <div class="text">${c.text}</div>
        <div class="time">${c.time}</div>
      </div>
    `).join("");
  }

  function addComment() {
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text || !currentListingId) {
      toast("Andika maoni kwanza", true);
      return;
    }

    if (!mockComments[currentListingId]) {
      mockComments[currentListingId] = [];
    }

    mockComments[currentListingId].unshift({
      id: Date.now(),
      author: "Wewe",
      text: text,
      time: "Sasa hivi"
    });

    // Hifadhi
    localStorage.setItem("comments", JSON.stringify(mockComments));

    input.value = "";
    loadComments(currentListingId);
    toast("Maoni yametumwa!");
  }

  document.getElementById("commentInput").addEventListener("keypress", e => {
    if (e.key === "Enter") addComment();
  });

  // ====================== CONTACT & SHARE ======================
  function contactSeller() {
    if (!currentSellerId) return;
    const listing = mockListings.find(l => l.id === currentListingId);
    toast(`Inafungua chat na ${listing.seller_name}...`);
    // Hapa unaweza kuweka WhatsApp link au modal
    // mfano: window.open(`https://wa.me/255XXXXXXXXX?text=Habari...`);
  }

  function shareListing() {
    const listing = mockListings.find(l => l.id === currentListingId);
    if (!listing) return;

    if (navigator.share) {
      navigator.share({
        title: listing.title,
        text: `${listing.title} - ${formatPrice(listing.price)}`,
        url: window.location.href
      }).catch(() => {});
    } else {
      // Fallback
      navigator.clipboard.writeText(`${listing.title} - \( {formatPrice(listing.price)}\n \){window.location.href}`);
      toast("Link imenakiliwa!");
    }
  }

  // ====================== FILTERS ======================
  function filterListings() {
    searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
    renderListings();
  }

  // Category buttons
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      renderListings();
    });
  });

  // ====================== INIT ======================
  renderListings();
</script>
</body>
  </html>
