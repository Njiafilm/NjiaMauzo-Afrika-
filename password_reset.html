<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <title>Badilisha Nenosiri — NjiaMauzo Afrika</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;">
          <tr>
            <td style="background:#0f172a;padding:24px 32px;text-align:center;border-bottom:1px solid #334155;">
              <span style="font-size:28px;">🔑</span>
              <h1 style="margin:8px 0 0;color:#f1f5f9;font-size:18px;">Badilisha Nenosiri</h1>
              <p style="margin:4px 0 0;color:#94a3b8;font-size:12px;">Password Reset Request</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;">
              <p style="margin:0 0 12px;color:#94a3b8;font-size:14px;">Habari <strong style="color:#f1f5f9;">{{name}}</strong>,</p>
              <p style="margin:0 0 16px;color:#94a3b8;font-size:14px;line-height:1.6;">
                Tumepokea ombi la kubadilisha nenosiri la akaunti yako.
                Tumia code ifuatayo / Use the code below:
              </p>
              <div style="margin:20px 0;padding:16px;background:#0f172a;border:2px dashed #0ea5e9;border-radius:12px;text-align:center;">
                <span style="font-size:28px;font-weight:bold;letter-spacing:6px;color:#38bdf8;">{{code}}</span>
              </div>
              <p style="margin:0 0 12px;color:#94a3b8;font-size:13px;">
                Code inaisha baada ya <strong style="color:#fbbf24;">10 dakika</strong>.
              </p>
              <p style="margin:16px 0 0;color:#f87171;font-size:12px;">
                ⚠️ Kama hukuomba hii, puuza barua hii. Akaunti yako iko salama.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 24px;border-top:1px solid #334155;text-align:center;">
              <p style="margin:0;color:#64748b;font-size:12px;">
                <a href="mailto:info@njiamauzo.africa" style="color:#4ade80;">info@njiamauzo.africa</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
